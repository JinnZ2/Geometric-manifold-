[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["simulation", "manifolds", "repair", "addon_thermodynamic_control"]

[tool.pytest.ini_options]
testpaths = ["tests"]
